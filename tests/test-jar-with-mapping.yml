name: Test Diffuse Action - JAR with mapping files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Java
        run: |
          java -version || (apt-get update -qq && apt-get install -y -qq default-jdk)

      - name: Create test JAR files and mapping files
        run: |
          mkdir -p /tmp/diffuse-mapping-test

          # Create old JAR with a simple class
          mkdir -p /tmp/old-map-classes
          cat > /tmp/OldMappedHello.java << 'EOF'
          public class OldMappedHello {
              public static void main(String[] args) {
                  System.out.println("Hello Old Mapped");
              }
          }
          EOF
          javac -d /tmp/old-map-classes /tmp/OldMappedHello.java
          jar cf /tmp/diffuse-mapping-test/old.jar -C /tmp/old-map-classes .

          # Create new JAR with a slightly different class
          mkdir -p /tmp/new-map-classes
          cat > /tmp/NewMappedHello.java << 'EOF'
          public class NewMappedHello {
              public static void main(String[] args) {
                  System.out.println("Hello New Mapped");
              }
              public void extraMethod() {}
          }
          EOF
          javac -d /tmp/new-map-classes /tmp/NewMappedHello.java
          jar cf /tmp/diffuse-mapping-test/new.jar -C /tmp/new-map-classes .

          # Create minimal ProGuard-style mapping files
          cat > /tmp/diffuse-mapping-test/old-mapping.txt << 'EOF'
          OldMappedHello -> a:
              void main(java.lang.String[]) -> a
          EOF

          cat > /tmp/diffuse-mapping-test/new-mapping.txt << 'EOF'
          NewMappedHello -> b:
              void main(java.lang.String[]) -> a
              void extraMethod() -> b
          EOF

          echo "Old JAR size: $(stat -c%s /tmp/diffuse-mapping-test/old.jar)"
          echo "New JAR size: $(stat -c%s /tmp/diffuse-mapping-test/new.jar)"
          echo "Old mapping:"
          cat /tmp/diffuse-mapping-test/old-mapping.txt
          echo "New mapping:"
          cat /tmp/diffuse-mapping-test/new-mapping.txt

      - id: action
        uses: .
        with:
          old-file-path: /tmp/diffuse-mapping-test/old.jar
          new-file-path: /tmp/diffuse-mapping-test/new.jar
          old-mapping-path: /tmp/diffuse-mapping-test/old-mapping.txt
          new-mapping-path: /tmp/diffuse-mapping-test/new-mapping.txt
          lib-version: latest
          diffuse-repo: usefulness/diffuse
          debug: 'false'

      - name: Assert size-old-bytes is set
        env:
          ACTUAL: ${{ steps.action.outputs.size-old-bytes }}
        run: |
          echo "actual size-old-bytes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: size-old-bytes output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert size-new-bytes is set
        env:
          ACTUAL: ${{ steps.action.outputs.size-new-bytes }}
        run: |
          echo "actual size-new-bytes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: size-new-bytes output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert diff-raw is set
        env:
          ACTUAL: ${{ steps.action.outputs.diff-raw }}
        run: |
          echo "actual diff-raw length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: diff-raw output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert diff-file is set and exists
        env:
          ACTUAL: ${{ steps.action.outputs.diff-file }}
        run: |
          echo "actual diff-file: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: diff-file output is empty"
            exit 1
          fi
          if [ ! -f "$ACTUAL" ]; then
            echo "FAIL: diff-file path does not point to an existing file"
            exit 1
          fi
          echo "PASS"

      - name: Assert summary is set
        env:
          ACTUAL: ${{ steps.action.outputs.summary }}
        run: |
          echo "actual summary length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: summary output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert size-diff-comment_style_1 is set
        env:
          ACTUAL: ${{ steps.action.outputs.size-diff-comment_style_1 }}
        run: |
          echo "actual size-diff-comment_style_1: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: size-diff-comment_style_1 output is empty"
            exit 1
          fi
          echo "PASS"
