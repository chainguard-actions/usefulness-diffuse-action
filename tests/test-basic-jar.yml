name: Test basic JAR diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q default-jdk wget python3 python3-pip python3-requests || true
          python3 -m pip install --quiet requests 2>/dev/null || \
            pip3 install --break-system-packages --quiet requests 2>/dev/null || true
          python3 -c "import requests; print('requests OK')"
          java -version
          wget --version | head -1

      - name: Create old JAR fixture
        run: |
          mkdir -p /tmp/jar-old/com/example
          cat > /tmp/jar-old/com/example/Hello.java << 'EOF'
          package com.example;
          public class Hello {
            public static void main(String[] args) {}
          }
          EOF
          cd /tmp/jar-old
          javac com/example/Hello.java
          jar cf /tmp/old.jar com/example/Hello.class
          ls -la /tmp/old.jar

      - name: Create new JAR fixture
        run: |
          mkdir -p /tmp/jar-new/com/example
          cat > /tmp/jar-new/com/example/Hello.java << 'EOF'
          package com.example;
          public class Hello {
            public static void main(String[] args) {
              System.out.println("hello");
            }
          }
          EOF
          cat > /tmp/jar-new/com/example/World.java << 'EOF'
          package com.example;
          public class World {}
          EOF
          cd /tmp/jar-new
          javac com/example/Hello.java com/example/World.java
          jar cf /tmp/new.jar com/example/Hello.class com/example/World.class
          ls -la /tmp/new.jar

      - id: action
        uses: .
        with:
          old-file-path: /tmp/old.jar
          new-file-path: /tmp/new.jar
          lib-version: "0.1.0"
          diffuse-repo: JakeWharton/diffuse
          old-mapping-path: ""
          new-mapping-path: ""
          debug: "false"

      - name: Assert size-old-bytes is set
        env:
          ACTUAL: ${{ steps.action.outputs.size-old-bytes }}
        run: |
          echo "actual size-old-bytes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: size-old-bytes output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert size-new-bytes is set
        env:
          ACTUAL: ${{ steps.action.outputs.size-new-bytes }}
        run: |
          echo "actual size-new-bytes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: size-new-bytes output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert size-old-text is set
        env:
          ACTUAL: ${{ steps.action.outputs.size-old-text }}
        run: |
          echo "actual size-old-text: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: size-old-text output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert size-new-text is set
        env:
          ACTUAL: ${{ steps.action.outputs.size-new-text }}
        run: |
          echo "actual size-new-text: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: size-new-text output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert diff-raw is set
        env:
          ACTUAL: ${{ steps.action.outputs.diff-raw }}
        run: |
          echo "actual diff-raw length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: diff-raw output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert diff-file is set and exists
        env:
          ACTUAL: ${{ steps.action.outputs.diff-file }}
        run: |
          echo "actual diff-file: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: diff-file output is empty"
            exit 1
          fi
          if [ ! -f "$ACTUAL" ]; then
            echo "FAIL: diff-file does not exist at path: $ACTUAL"
            exit 1
          fi
          echo "PASS"
