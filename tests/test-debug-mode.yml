name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q default-jdk wget python3 python3-pip python3-requests || true
          python3 -m pip install --quiet requests 2>/dev/null || \
            pip3 install --break-system-packages --quiet requests 2>/dev/null || true
          python3 -c "import requests; print('requests OK')"
          java -version
          wget --version | head -1

      - name: Create old JAR fixture
        run: |
          mkdir -p /tmp/jar-debug-old/com/example
          cat > /tmp/jar-debug-old/com/example/App.java << 'EOF'
          package com.example;
          public class App {}
          EOF
          cd /tmp/jar-debug-old
          javac com/example/App.java
          jar cf /tmp/old-debug.jar com/example/App.class
          ls -la /tmp/old-debug.jar

      - name: Create new JAR fixture
        run: |
          mkdir -p /tmp/jar-debug-new/com/example
          cat > /tmp/jar-debug-new/com/example/App.java << 'EOF'
          package com.example;
          public class App {
            public void run() {}
          }
          EOF
          cd /tmp/jar-debug-new
          javac com/example/App.java
          jar cf /tmp/new-debug.jar com/example/App.class
          ls -la /tmp/new-debug.jar

      - id: action
        uses: .
        with:
          old-file-path: /tmp/old-debug.jar
          new-file-path: /tmp/new-debug.jar
          lib-version: "0.1.0"
          diffuse-repo: JakeWharton/diffuse
          old-mapping-path: ""
          new-mapping-path: ""
          debug: "true"

      - name: Assert size-old-bytes is a number
        env:
          ACTUAL: ${{ steps.action.outputs.size-old-bytes }}
        run: |
          echo "actual size-old-bytes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: size-old-bytes output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: size-old-bytes is not a number: $ACTUAL"
            exit 1
          fi
          echo "PASS: size-old-bytes=$ACTUAL"

      - name: Assert size-new-bytes is a number
        env:
          ACTUAL: ${{ steps.action.outputs.size-new-bytes }}
        run: |
          echo "actual size-new-bytes: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: size-new-bytes output is empty"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -qE '^[0-9]+$'; then
            echo "FAIL: size-new-bytes is not a number: $ACTUAL"
            exit 1
          fi
          echo "PASS: size-new-bytes=$ACTUAL"

      - name: Assert diff-gh-comment is set
        env:
          ACTUAL: ${{ steps.action.outputs.diff-gh-comment }}
        run: |
          echo "actual diff-gh-comment length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: diff-gh-comment output is empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert diff-gh-comment-all-collapsed is set
        env:
          ACTUAL: ${{ steps.action.outputs.diff-gh-comment-all-collapsed }}
        run: |
          echo "actual diff-gh-comment-all-collapsed length: ${#ACTUAL}"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: diff-gh-comment-all-collapsed output is empty"
            exit 1
          fi
          echo "PASS"
